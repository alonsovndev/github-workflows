name: Docker build

on:
  workflow_call:
    inputs:
      image-name:
        description: Local tag for the built image. Nothing is pushed.
        type: string
        default: ci
      context:
        type: string
        default: .
      dockerfile:
        type: string
        default: Dockerfile

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: false
          tags: ${{ inputs.image-name }}:ci
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
