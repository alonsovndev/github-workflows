name: PR title

on:
  workflow_call:
    inputs:
      pattern:
        description: Extended regex the pull request title must match (default is the handbook Conventional Commits pattern).
        type: string
        default: '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .{1,100}$'

permissions:
  contents: read

jobs:
  pr-title:
    name: Title follows Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PATTERN: ${{ inputs.pattern }}
        run: |
          if [ -z "$PR_TITLE" ]; then
            echo "No pull request title found. Call this workflow from a pull_request event." >&2
            exit 1
          fi
          if ! printf '%s\n' "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "PR title must follow Conventional Commits: <type>[scope]: <description>" >&2
            exit 1
          fi
