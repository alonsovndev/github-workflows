# Copy to .github/workflows/ci.yml in a FastAPI repository.
name: CI

on:
  pull_request:
    branches: [main, dev]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    uses: alonsovndev/github-workflows/.github/workflows/pr-title.yml@v1

  python:
    uses: alonsovndev/github-workflows/.github/workflows/python-ci.yml@v1
    with:
      postgres-image: postgres:16-alpine
      coverage-xml-path: coverage.xml
